version: '3.8'

services:
  django:
    build: ./backend/core
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
    depends_on:
      - mysql
    volumes:
      - ./backend/core:/app

  fastapi:
    build: ./backend/fastapi-cart
    ports:
      - "8001:8001"
    depends_on:
      - mongodb

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pcb_ecommerce
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  nextjs:
    build: ./frontend/nextjs-shop
    ports:
      - "3000:3000"

  react:
    build: ./frontend/react-admin
    ports:
      - "3001:3001"

volumes:
  mysql_data:
  mongo_data: