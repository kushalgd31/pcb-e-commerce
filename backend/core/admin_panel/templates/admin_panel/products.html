<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>
<body>
    <h1>Products</h1>
    <a href="{% url 'admin_product_add' %}">Add Product</a>
    <ul>
        {% for product in products %}
        <li>
            {{ product.name }} - ${{ product.price }}
            <a href="{% url 'admin_product_edit' product.pk %}">Edit</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
